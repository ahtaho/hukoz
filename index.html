<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F8F2E1">
    <meta name="description" content="VAVALS — Korean rice burgers. Korean &amp; Japanese fusion burgers. Takeaway, opening soon in Wrocław, Grunwaldzki. Burgery fusion koreańsko-japońskie. Na wynos. Już wkrótce.">
    <title>VAVALS - Korean Rice Burger</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G1MDY94D8M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-G1MDY94D8M');
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #F8F2E1;
        --ink: #3A2A21;
        --muted: #776859;
        --orange: #F34A20;
        --green: #1C4C1E;
        --line: #3A2A2126;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, sans-serif;
        overflow-wrap: anywhere;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--green);
        color: var(--paper);
      }

      .viewport {
        min-height: 100vh;
        min-height: 100dvh;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      .page {
        width: min(100%, 1800px);
        margin: 0 auto;
        padding: clamp(12px, 2vh, 24px) clamp(16px, 4vw, 64px);
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1 0 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(8px, 1.5vh, 22px) 0 clamp(26px, 3.5vh, 46px);
        text-align: center;
      }

      main > * {
        flex-shrink: 0;
        min-width: 0;
        max-width: 100%;
      }

      .brand,
      .details {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-width: 0;
      }

      .brand > *,
      .details > * {
        flex-shrink: 0;
        max-width: 100%;
        min-width: 0;
      }

      /* SVG의 비율과 도형은 유지하고 바깥 여백만 줄입니다. */
      h1 {
        position: relative;
        width: min(100%, clamp(240px, 34vw, 640px), 49vh);
        width: min(100%, clamp(240px, 34vw, 640px), 49dvh);
        aspect-ratio: 1000 / 780;
        overflow: hidden;
        margin: 0;
        line-height: 0;
      }

      .brand-logo {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        transform: translateY(-9%);
      }

      .brand-description {
        margin: clamp(8px, 1vh, 12px) 0 0;
        font-size: clamp(22px, 0.8rem + 0.35vw, 22px);
        font-weight: 888;
        line-height: 1.5;
        letter-spacing: 0.02em;
        text-wrap: balance;
      }

      .intro {
        width: min(100%, 52rem);
        margin-top: clamp(20px, 2.8vh, 30px);
      }

      .concept {
        margin: 0;
        font-size: clamp(1.0625rem, 0.9rem + 0.4vw, 1.375rem);
        font-weight: 400;
        line-height: 1.4;
        text-wrap: balance;
      }

      .translation {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: clamp(0.875rem, 0.8rem + 0.2vw, 1.0625rem);
        line-height: 1.45;
        text-wrap: balance;
      }

      .takeaway,
      .opening {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.6em;
        font-size: clamp(0.875rem, 0.8rem + 0.2vw, 1.0625rem);
        line-height: 1.4;
      }

      .takeaway {
        margin: clamp(16px, 2vh, 22px) 0 0;
        color: var(--green);
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .separator {
        color: var(--muted);
        font-weight: 400;
      }

      .divider {
        width: 28px;
        height: 1px;
        margin: clamp(16px, 2.2vh, 24px) 0;
        background: var(--line);
      }

      .opening {
        margin: 0;
        padding: 10px 20px;
        border: 1px solid transparent;
        border-radius: 30px;
        font-weight: 400;
        letter-spacing: 0.025em;
        box-shadow:none;
      }

      .opening span,
      .takeaway span {
        white-space: nowrap;
      }

      .takeaway [lang="en"] {
        color: var(--green);
        font-weight: 600;
      }

      .opening .separator,
      .takeaway .separator {
        font-size: 0.8em;
        color: var(--green);
      }

      .opening .separator {
        color: var(--orange);
      }

      @keyframes neonPulse {
        0%, 100% {
           border-color: transparent;
		   box-shadow: none;
        }

        50% {
          border-color: var(--orange);
          box-shadow:
            0 0 5px rgba(243, 74, 32, 0.52),
            0 0 12px rgba(243, 74, 32, 0.24),
            0 0 20px rgba(243, 74, 32, 0.10);
        }
      }

      /* 첫 진입 시 브랜드 요소를 순서대로 부드럽게 보여줍니다. */
      @keyframes entranceFadeUp {
        from {
          opacity: 0;
          transform: translate3d(0, 14px, 0);
        }

        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      h1 {
        opacity: 1;
        animation: none;
        transform: none;
      }

      .brand-description,
      .intro,
      .divider,
      .takeaway,
      .opening,
      .location,
      footer {
        opacity: 0;
        animation: entranceFadeUp 1000ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .brand-description {
        animation-delay: 180ms;
      }

      .intro {
        animation-delay: 300ms;
      }

      .divider {
        animation-delay: 400ms;
      }

      .takeaway {
        animation-delay: 490ms;
      }

      .opening {
        animation:
          entranceFadeUp 760ms cubic-bezier(0.22, 1, 0.36, 1) 600ms both,
          neonPulse 3.2s ease-in-out 2s infinite;
      }

      .location {
        animation-delay: 720ms;
      }

      footer {
        animation-delay: 850ms;
      }

      .location {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: clamp(0.875rem, 0.8rem + 0.15vw, 1rem);
        line-height: 1.45;
        letter-spacing: 0.015em;
      }

      footer {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px 20px;
        padding-top: clamp(12px, 1.6vh, 18px);
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: clamp(0.8125rem, 0.75rem + 0.1vw, 0.875rem);
        font-weight: 400;
        line-height: 1.5;
      }

      footer p {
        margin: 0;
        white-space: nowrap;
      }

      .footer-brand {
        display: flex;
        align-items: baseline;
        gap: 0.55em;
        color: var(--ink);
      }

      .footer-dot {
        color: var(--muted);
      }

      .footer-korean {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        font-size: inherit;
        font-weight: 400;
        letter-spacing: 0;
      }

      @media (max-width: 640px) {
        h1 {
          width: min(100%, 340px, 43vh);
          width: min(100%, 340px, 43dvh);
        }

        footer {
          flex-direction: column;
          justify-content: center;
          text-align: center;
          gap: 5px;
        }

        .opening {
          padding: 9px 14px;
          gap: 0.45em;
          letter-spacing: 0;
        }
      }

      @media (max-height: 540px) {
        .page {
          padding-top: 8px;
          padding-bottom: 8px;
        }

        main {
          padding-top: 4px;
          padding-bottom: 12px;
        }

        h1 {
          width: min(100%, 28vh);
          width: min(100%, 28dvh);
        }

        .brand-description {
          margin-top: 5px;
        }

        .intro {
          margin-top: 12px;
        }

        .translation {
          margin-top: 5px;
        }

        .takeaway {
          margin-top: 12px;
        }

        .divider {
          margin: 12px 0;
        }

        .opening {
          padding: 7px 14px;
        }

        .location {
          margin-top: 10px;
        }

        footer {
          padding-top: 8px;
        }
      }

      /* 낮고 넓은 화면에서는 로고와 안내를 나란히 배치해 가독성을 유지합니다. */
      @media (min-width: 680px) and (max-height: 540px) {
        main {
          display: grid;
          grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
          column-gap: clamp(20px, 4vw, 48px);
          width: min(100%, 1100px);
          align-self: center;
          align-items: center;
        }

        h1 {
          width: min(100%, 300px, 66vh);
          width: min(100%, 300px, 66dvh);
        }

        .brand-description {
          font-size: 0.875rem;
          letter-spacing: 0.07em;
        }

        .intro {
          margin-top: 0;
        }

        .concept {
          font-size: 1.0625rem;
        }

        .translation,
        .takeaway,
        .opening,
        .location {
          font-size: 0.875rem;
        }

        .divider {
          margin: 12px 0;
        }

        .opening {
          padding: 9px 14px;
        }
      }

      /* 내용의 실제 높이를 측정한 뒤 화면 안에 맞춥니다. 단순히 잘라 숨기지 않습니다. */
      html.fitted,
      html.fitted body {
        width: 100%;
        height: auto;
        min-height: 100%;
        overflow: visible;
        overscroll-behavior-y: auto;
      }

      html.fitted .viewport {
        position: relative;
        inset: auto;
        min-height: 0;
        height: 100vh;
        height: 100dvh;
        overflow: visible;
      }

      html.fitted .page {
        position: absolute;
        margin: 0;
        transform-origin: center;
      }

      /* 각 줄의 점을 같은 세로 중심선에 맞춥니다. */
      .takeaway,
      .opening,
      .location {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        width: max-content;
        max-width: 100%;
      }

      .location {
        column-gap: 0.6em;
      }

      .takeaway > :first-child,
      .opening > :first-child,
      .location > :first-child {
        text-align: right;
        white-space: nowrap;
      }

      .takeaway > :last-child,
      .opening > :last-child,
      .location > :last-child {
        text-align: left;
        white-space: nowrap;
      }

      .takeaway > .separator,
      .opening > .separator,
      .location > .separator {
        text-align: center;
        letter-spacing: 0;
      }

      /* 구분선 아래의 매장 안내를 한 묶음으로 배치합니다. */
      .service-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-width: 0;
      }

      .service-info > p {
        margin: 0;
        flex-shrink: 0;
      }

      .service-info .separator {
        letter-spacing: 0;
      }

      @media (max-height: 540px) {
        .service-info {
          gap: 10px;
        }
      }

      .takeaway .separator,
      .opening .separator,
      .location .separator {
        font-size: 13px;
        font-weight: 400;
        line-height: 1;
      }

      /* 모바일 공통 탄성 바운스 효과 */
      .viewport {
        will-change: transform;
        transform: translate3d(0, 0, 0);
      }

      .viewport.is-bouncing {
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .viewport.is-bouncing {
          transition: none;
        }

        .brand-description,
        .intro,
        .divider,
        .takeaway,
        .opening,
        .location,
        footer {
          opacity: 1;
          animation: none;
          transform: none;
        }
      }

    </style>
  </head>
  <body>
    <div class="viewport">
      <div class="page">
        <main>
          <div class="brand">
            <!-- SVG 파일을 index.html과 같은 폴더에 넣어주세요. -->
            <h1>
              <img class="brand-logo" src="VAVALS_MASTER_PRIMARY.svg" alt="VAVALS" width="1000" height="1000" fetchpriority="high">
            </h1>

            <!-- 로고 아래 설명 -->
            <p class="brand-description" lang="en">KOREAN RICE BURGER</p>
          </div>

          <div class="details">
            <div class="intro">
              <p class="concept" lang="pl">Burgery fusion koreańsko-japońskie.</p>
              <p class="translation" lang="en">Korean &amp; Japanese Fusion Burgers</p>
            </div>

            <div class="divider" aria-hidden="true"></div>

            <div class="service-info">
              <p class="takeaway">
                <span lang="pl">NA WYNOS</span>
                <span class="separator" aria-hidden="true">•</span>
                <span lang="en">TAKEAWAY</span>
              </p>

              <p class="opening">
                <span lang="pl">JUŻ WKRÓTCE</span>
                <span class="separator" aria-hidden="true">•</span>
                <span lang="en">OPENING SOON</span>
              </p>
              <!-- 상세주소는 공개하지 않고 지역만 표시합니다. -->
              <p class="location" lang="pl">
                <span>Wrocław</span>
                <span class="separator" aria-hidden="true">•</span>
                <span>Grunwaldzki</span>
              </p>
            </div>
          </div>
        </main>

        <footer>
          <p class="footer-brand">© VAVALS <span class="footer-dot" aria-hidden="true">•</span> <span class="footer-korean" lang="ko">밥알스</span></p>
          <p class="footer-operator" lang="en">Operated by HUKOZ Sp. z o.o.</p>
        </footer>
      </div>
    </div>
    <script>
      (() => {
        const viewport = document.querySelector('.viewport');
        const page = document.querySelector('.page');

        let scheduled = 0;

        function fitPage() {
          scheduled = 0;
          document.documentElement.classList.add('fitted');

          const padding = getComputedStyle(viewport);
          const left = parseFloat(padding.paddingLeft) || 0;
          const right = parseFloat(padding.paddingRight) || 0;
          const top = parseFloat(padding.paddingTop) || 0;
          const bottom = parseFloat(padding.paddingBottom) || 0;
          const width = Math.max(1, viewport.clientWidth - left - right);
          const height = Math.max(1, viewport.clientHeight - top - bottom);

          page.style.width = Math.max(320, Math.min(width, 1800)) + 'px';
          page.style.height = 'auto';
          page.style.transform = 'none';

          const naturalWidth = Math.max(page.offsetWidth, page.scrollWidth);
          const naturalHeight = Math.max(page.offsetHeight, page.scrollHeight) + 2;
          const scale = Math.min(1, width / naturalWidth, height / naturalHeight);

          page.style.height = (height / scale) + 'px';
          page.style.left = (left + width / 2) + 'px';
          page.style.top = (top + height / 2) + 'px';
          page.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
        }

        function scheduleFit() {
          if (!scheduled) scheduled = requestAnimationFrame(fitPage);
        }

        fitPage();
        window.addEventListener('resize', scheduleFit);
        window.addEventListener('orientationchange', scheduleFit);
        window.addEventListener('load', scheduleFit);
        if (document.fonts) document.fonts.ready.then(scheduleFit);

        // 모바일 브라우저마다 다른 네이티브 overscroll 대신,
        // 손가락 움직임에 맞춰 화면을 조금 끌었다가 부드럽게 복귀시킵니다.
        let touchStartY = 0;
        let touchStartX = 0;
        let bounceOffset = 0;
        let trackingBounce = false;

        const MAX_BOUNCE = 22;
        const RESISTANCE = 0.16;

        function setBounce(y) {
          bounceOffset = y;
          viewport.classList.remove('is-bouncing');
          viewport.style.transform = 'translate3d(0,' + y + 'px,0)';
        }

        function releaseBounce() {
          if (!trackingBounce && bounceOffset === 0) return;
          trackingBounce = false;
          bounceOffset = 0;
          viewport.classList.add('is-bouncing');
          viewport.style.transform = 'translate3d(0,0,0)';
        }

        viewport.addEventListener('touchstart', (event) => {
          if (event.touches.length !== 1) return;

          const touch = event.touches[0];
          touchStartY = touch.clientY;
          touchStartX = touch.clientX;
          trackingBounce = true;
          viewport.classList.remove('is-bouncing');
        }, { passive: true });

        viewport.addEventListener('touchmove', (event) => {
          if (!trackingBounce || event.touches.length !== 1) return;

          const touch = event.touches[0];
          const deltaY = touch.clientY - touchStartY;
          const deltaX = touch.clientX - touchStartX;

          // 가로 제스처는 건드리지 않습니다.
          if (Math.abs(deltaX) > Math.abs(deltaY)) return;

          const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
          const maxScroll = Math.max(
            0,
            document.documentElement.scrollHeight - window.innerHeight
          );

          const atTop = scrollTop <= 0;
          const atBottom = scrollTop >= maxScroll - 1;

          // 상단에서 아래로 당기는 제스처는 브라우저 기본 동작에 맡깁니다.
          // (iOS/Android의 Pull-to-Refresh를 막지 않기 위해 preventDefault 하지 않음)
          if (deltaY > 0 && atTop) {
            return;
          }

          // 하단에서 위로 더 당길 때만 커스텀 바운스를 적용합니다.
          if (deltaY < 0 && atBottom) {
            event.preventDefault();

            const distance = Math.min(
              MAX_BOUNCE,
              Math.abs(deltaY) * RESISTANCE
            );

            setBounce(-distance);
          }
        }, { passive: false });

        viewport.addEventListener('touchend', releaseBounce, { passive: true });
        viewport.addEventListener('touchcancel', releaseBounce, { passive: true });
      })();
    </script>
  </body>
</html>
